
# Database
# NOTE: In Docker we override these via environment variables in docker-compose.yml.
# The local default points to localhost for running the backend directly without Docker.
# To avoid confusion with docker-compose (which creates 'odyssey' database and user),
# keep these as sensible local defaults but distinct from container values.
spring.datasource.url=jdbc:mysql://localhost:3306/odyssey?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=odyssey_user
spring.datasource.password=odyssey_pass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Settings
app.jwt.secret=y6gB9KqXeU73LFZ1uQ8nPHLqv0RVW0p2sYVZzTrOIb0fjwzVmXN6PyYazsKPqfKXGHylxXPS6kBPpTrWqG7EKg==
app.jwt.expiration=86400000

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# Server
server.port=9090

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.odyssey=DEBUG
